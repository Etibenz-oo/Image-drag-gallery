<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Display Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Drag & Display Gallery</h1>

        <div class="gallery">

            <div class="thumbnails">
                <img src="images/image1.jpg" alt="Image 1" draggable="true">
                <img src="images/image2.jpg" alt="Image 2" draggable="true">
                <img src="images/image3.jpg" alt="Image 3" draggable="true">
                <img src="images/image4.jpg" alt="Image 4" draggable="true">
                <img src="images/image5.jpg" alt="Image 5" draggable="true">
            </div>

            <div class="display-box">
                <p>Drag an image here</p>
                <img id="largeImage" src="" alt="Selected image">
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
